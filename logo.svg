<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Mountain M shape -->
  <path d="M20 120 L60 40 L100 120 L140 60 L180 120" 
        fill="none" 
        stroke="url(#mountainGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Second M layer -->
  <path d="M35 120 L75 40 L115 120 L155 60 L195 120" 
        fill="none" 
        stroke="#60a5fa" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.6"/>
  
  <!-- Circuit lines -->
  <line x1="200" y1="80" x2="260" y2="80" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="265" cy="80" r="4" fill="#60a5fa"/>
  <line x1="200" y1="100" x2="240" y2="100" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="245" cy="100" r="4" fill="#60a5fa"/>
  <line x1="200" y1="60" x2="230" y2="60" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="235" cy="60" r="4" fill="#60a5fa"/>
  
  <!-- AMA TEXT -->
  <text x="280" y="90" font-family="'Inter', sans-serif" font-size="42" font-weight="800" fill="#e2e8f0" letter-spacing="2">AMA</text>
  
  <!-- TECH TEXT -->
  <text x="280" y="130" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#3b82f6" letter-spacing="4">TECH</text>
  
  <!-- Subtitle -->
  <text x="280" y="150" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b" letter-spacing="3">DEV • WEB • MARKETING • SUD MAROC</text>
</svg>